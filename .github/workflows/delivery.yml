name: APLYD delivery
on:
  pull_request:
  push:
    branches: [main, 'chore/aplyd-delivery-standards']
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delivery-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  integrity:
    name: Reference integrity and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.15'}
      - run: python scripts/check-standards.py
      - run: python scripts/check-secrets.py
  engineering:
    name: Code checks and application tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.4.2-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sidecar/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.15'}
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: sidecar
      - name: Validate the unified proxy without network access
        run: >-
          docker run --rm --network none
          --mount "type=bind,source=$GITHUB_WORKSPACE/caddy/unified-site.caddy,target=/etc/caddy/Caddyfile,readonly"
          caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
        working-directory: sidecar
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high
        working-directory: sidecar
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Execute tests and retain a nonempty JUnit report
        run: mkdir -p ../reports && npm test -- --reporter=default --reporter=junit --outputFile.junit=../reports/vitest.xml
        working-directory: sidecar
      - run: python scripts/check-test-report.py reports/vitest.xml
      - run: npm run build
        working-directory: sidecar
      - run: node scripts/workspace-smoke.mjs
      - name: Install the pinned Chromium headless browser
        run: npx playwright install --with-deps --only-shell chromium
      - name: Qualify the actual engine with disposable synthetic data
        run: bash scripts/start-qualification.sh
      - name: Restore and reconcile the disposable recovery fixture
        run: node scripts/qualify-recovery.mjs
      - name: Remove only the disposable qualification stack
        if: always()
        run: |
          if [ -f .qualification/stack.env ]; then
            docker compose --env-file .qualification/stack.env -f docker-compose.qualification.yml -p dde-qualification down --volumes
            if [ -f .qualification/recovery-target-created ]; then
              docker compose --env-file .qualification/stack.env -f docker-compose.qualification.yml -p dde-recovery-qualification down --volumes
            fi
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: engine-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .quality/evidence/engine-qualification.json
            .quality/evidence/recovery-qualification.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/vitest.xml
          if-no-files-found: error
          retention-days: 14
  native:
    name: Native adoption readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.15'}
      - name: Preserve actual native audit failures and hold incomplete adoption
        shell: bash
        run: |
          mkdir -p reports
          set +e
          python -B .aplyd/engineering/2.1.0/06-enforcement/scripts/engctl.py audit --repo . > reports/engineering-audit.json
          engineering=$?
          python -B .aplyd/testing/1.3/checker/qa_lint.py --registers .quality/registers --root . > reports/qa-records.json
          qa=$?
          if [ -f .product/plan.json ] && [ -n "${APLYD_PM_TRUST_STORE:-}" ]; then
            python -B .aplyd/product/4.2/checker/quality_checker.py loop --document .product/plan.json --report reports/product.json --state-dir reports/product-state --trust-store "$APLYD_PM_TRUST_STORE"
            product=$?
          else
            echo 'HELD: actual native product plan and separately trusted review store are not configured.'
            product=2
          fi
          cat reports/engineering-audit.json
          cat reports/qa-records.json
          test "$engineering" -eq 0 && test "$qa" -eq 0 && test "$product" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/*.json
          if-no-files-found: error
          retention-days: 14
  required:
    name: APLYD required gates
    if: always()
    needs: [integrity, engineering, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject failed, skipped, cancelled or missing required results
        env:
          INTEGRITY: ${{ needs.integrity.result }}
          ENGINEERING: ${{ needs.engineering.result }}
          NATIVE: ${{ needs.native.result }}
        run: |
          test "$INTEGRITY" = success
          test "$ENGINEERING" = success
          test "$NATIVE" = success
